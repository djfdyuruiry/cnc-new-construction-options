# yaml-language-server: $schema=./config.yml.schema.json
$schema: config.yml.schema.json

NCO:
  GitHubRepo:
    Owner: djfdyuruiry
    Name: cnc-new-construction-options
  Release: latest
  AssetPrefix: nco-release-${OS}
  MsvcRuntimeUrl: https://aka.ms/vs/17/release/vc_redist.x64.exe

# TODO: Read ICO files and add to UI as we install
# TODO: Add dos demo files https://cnc.fandom.com/wiki/Command_%26_Conquer_demo and add nco feature matching info here https://github.com/TheAssemblyArmada/Vanilla-Conquer/wiki/Installing-VanillaTD#patching-cc95-gold-with-demo-for-dos-mode
TiberianDawn:
  SortOrder: 1
  Name: Tiberian Dawn
  DisplayName: >-
    Command & Conquer: Tiberian Dawn
  NcoZipPath: td
  InstallPostfix: tiberian-dawn
  Binary: nco-td
  DiscImages:
    - SortOrder: 1
      Name: GDI
      Required: true
      Sources:
        - Name: internet-archive
          DisplayName: Internet Archive
          Url: https://archive.org/download/CommandConquerUSAWindows95Rerelease/Command%20%26%20Conquer%20%28USA%29%20%28Disc%201%29%20%28Windows%2095%29%20%28Rerelease%29.zip
          File: Command & Conquer (USA) (Disc 1) (Windows 95) (Rerelease).bin
          Checksum: 245847b1b76b0b1d04edda360ece732430158b774f5cecffd492bbf95ae96f62
      SplashScreenFile: SETUP.BMP
      SetupPackageFile: INSTALL\\SETUP.Z
      Provides:
        _root:
          - CCLOCAL.MIX
          - CONQUER.MIX
          - DESEICNH.MIX
          - DESERT.MIX
          - SOUNDS.MIX
          - SPEECH.MIX
          - TEMPERAT.MIX
          - TEMPICNH.MIX
          - TRANSIT.MIX
          - UPDATE.MIX
          - UPDATEC.MIX
          - WINTER.MIX
          - WINTICNH.MIX
        GDI:
          - GENERAL.MIX
          - MOVIES.MIX
          - SCORES.MIX
    - SortOrder: 2
      Name: NOD
      Sources:
        - Name: internet-archive
          DisplayName: Internet Archive
          Url: https://archive.org/download/CommandConquerUSAWindows95Rerelease/Command%20%26%20Conquer%20%28USA%29%20%28Disc%202%29%20%28Windows%2095%29%20%28Rerelease%29%20%28Rev%201%29.zip
          File: Command & Conquer (USA) (Disc 2) (Windows 95) (Rerelease) (Rev 1).bin
          Checksum: ed12239cd39c31036cf93cb75bf9584726a3ab8b78304a0d5ac075cd75283e3c
      SplashScreenFile: SETUP.BMP
      SetupPackageFile: INSTALL\\SETUP.Z
      Provides:
        NOD:
          - GENERAL.MIX
          - MOVIES.MIX
          - SCORES.MIX
    - SortOrder: 3
      Name: CovertOps
      DisplayName: >-
        Covert Operations (Expansion)
      Sources:
        - Name: internet-archive
          DisplayName: Internet Archive
          Url: https://archive.org/download/CommandConquerTheCovertOperationsUSA/Command%20%26%20Conquer%20-%20The%20Covert%20Operations%20%28USA%29.zip
          File: Command & Conquer - The Covert Operations (USA) (Track 1).bin
          Checksum: c5f6a8245063b7ddde9b0290c4da62bdfd83f8a326191d12a66a95db55593280
      Provides:
        _root:
          - INSTALL\\SC-000.MIX
          - INSTALL\\SC-001.MIX
          - INSTALL\\SPEECH.MIX
        COVERTOPS:
          - GENERAL.MIX
          - MOVIES.MIX
          - SCORES.MIX
  ZipUrls: []

RedAlert:
  SortOrder: 2
  Name: Red Alert
  DisplayName: >-
    Command & Conquer: Red Alert
  NcoZipPath: ra
  InstallPostfix: red-alert
  Binary: nco-ra
  DiscImages:
    - SortOrder: 1
      Name: ALLIES
      DisplayName: Allies
      Required: true
      Sources:
        - Name: cnc-comm
          DisplayName: C&C Communications Center
          Url: https://bigdownloads.cnc-comm.com/ra/RA_Allies.zip
          File: CD1_ALLIES.iso
          Checksum: c52767a770d1bdf74922cbec13f003cc9ff56514f1127517c56d8fb0bc3033d2
      SplashScreenFile: SETUP95\\SETUP.BMP
      Provides:
        _root:
          - INSTALL\\REDALERT.MIX
        ALLIES:
          - MAIN.MIX
    - SortOrder: 2
      Name: SOVIET
      DisplayName: Soviet
      Sources:
        - Name: cnc-comm
          DisplayName: C&C Communications Center
          Url: https://bigdownloads.cnc-comm.com/ra/RA_Soviet.zip
          File: CD2_Soviet.iso
          Checksum: 1127d6f013a4ae7596f19dce5e6ed5b235e0f837849b593dd97a455d4cbcc986
      SplashScreenFile: SETUP95\\SETUP.BMP
      Provides:
        _root:
          - INSTALL\\REDALERT.MIX
        SOVIET:
          - MAIN.MIX
    - SortOrder: 3
      Name: COUNTERSTRIKE
      DisplayName: Counterstrike (Expansion)
      Sources:
        - Name: cnc-comm
          DisplayName: C&C Communications Center
          Url: https://bigdownloads.cnc-comm.com/ra/RA_Counterstrike.zip
          File: CD3_Counterstrike.bin
          Checksum: 27e8eb048ad39adb3e541ce809f95e9c684e9819f62243ac2d0acfc567660b01
      SplashScreenFile: SETUP95\\SETUP.BMP
      Provides:
        COUNTERSTRIKE:
          - MAIN.MIX
    - SortOrder: 4
      Name: AFTERMATH
      DisplayName: The Aftermath (Expansion)
      Sources:
        - Name: cnc-comm
          DisplayName: C&C Communications Center
          Url: https://bigdownloads.cnc-comm.com/ra/RA_Aftermath.zip
          File: CD4_Aftermath.bin
          Checksum: 04704dffe5a889d9cc4c784b0e3012a2af112e494177e064d2b2e493a624671e
      SplashScreenFile: SETUP95\\SETUP.BMP
      Provides:
        AFTERMATH:
          - MAIN.MIX
  # TODO: SplashScreenUrl, pull image from internet for display during install
  ZipUrls:
    - SortOrder: 1
      Name: TheLostFiles
      DisplayName:
        The Lost Files ('Counterstrike'/'The Aftermath' Cutscenes)
      Url: https://www.mediafire.com/download/4b767436vd2et54/ra_TLF_Videos_v3-en.zip
      InfoUrl: https://github.com/djfdyuruiry/cnc-new-construction-options/wiki/2c.Red-Alert-Enhancements
      ProvidesFilesEndingWith: .MIX
