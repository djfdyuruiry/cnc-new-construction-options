Options:
  GitHubRepo:
    Owner: djfdyuruiry
    Name: cnc-new-construction-options
  Release: latest
  AssetPrefix: vanilla-conquer-nco-${OS}

# TODO: Add dos demo files https://cnc.fandom.com/wiki/Command_%26_Conquer_demo and add nco feature matching info here https://github.com/TheAssemblyArmada/Vanilla-Conquer/wiki/Installing-VanillaTD#patching-cc95-gold-with-demo-for-dos-mode
TiberianDawn:
  NcoZipPath: td
  InstallPostfix: td
  DiscImages:
    GDI:
      Sources:
        - Name: cnc-comm
          Url: https://bigdownloads.cnc-comm.com/cnc1/CNC95_GDI.zip
          File: CNC95_GDI.iso
      Provides:
        _root:
          - CCLOCAL.MIX
          - CONQUER.MIX
          - DESEICNH.MIX
          - DESERT.MIX
          - SOUNDS.MIX
          - SPEECH.MIX
          - TEMPERAT.MIX
          - TEMPICNH.MIX
          - TRANSIT.MIX
          - UPDATE.MIX
          - UPDATEC.MIX
          - WINTER.MIX
          - WINTICNH.MIX
        GDI:
          - GENERAL.MIX
          - MOVIES.MIX
          - SCORES.MIX
    NOD:
      Sources:
        - Name: cnc-comm
          Url: https://bigdownloads.cnc-comm.com/cnc1/CNC95_Nod.zip
          File: CNC95_Nod.iso
      Provides:
        NOD:
          - GENERAL.MIX
          - MOVIES.MIX
          - SCORES.MIX
    CovertOps:
      Sources:
        - Name: cnc-comm
          Url: https://bigdownloads.cnc-comm.com/cnc1/CNC_Covertops.zip
          File: CD3_Covertops.bin
      Provides:
        _root:
          - INSTALL\\SC-000.MIX
          - INSTALL\\SC-001.MIX
          - INSTALL\\SPEECH.MIX
        COVERTOPS:
          - GENERAL.MIX
          - MOVIES.MIX
          - SCORES.MIX
