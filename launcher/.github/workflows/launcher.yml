#dotnet build CNC.NCO.Launcher.csproj -c Release
# dotnet publish CNC.NCO.Launcher.csproj -c Release --runtime linux-x64 -p:DebugSymbols=false -p:PublishSingleFile=true --self-contained true
name: Launcher CI

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

jobs:
  build:
    strategy:
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest, macos-12-runner]

    runs-on: ${{ matrix.os }}

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '9.0.x'

      - name: Restore dependencies
        run: dotnet restore CNC.NCO.Launcher.csproj

      - name: Build project (Release)
        run: dotnet build CNC.NCO.Launcher.csproj -c Release

      # For macOS ARM64, we need to specify the runtime explicitly
      - name: Build self-contained for macOS ARM64
        if: runner.os == 'macOS' && matrix.os == 'macos-12-runner'
        run: dotnet build CNC.NCO.Launcher.csproj -c Release -r osx-arm64 --self-contained

      # For Linux, use linux-x64 runtime
      - name: Build self-contained for Linux
        if: runner.os == 'Linux'
        run: dotnet build CNC.NCO.Launcher.csproj -c Release -r linux-x64 --self-contained

      # For Windows, use win-x64 runtime
      - name: Build self-contained for Windows
        if: runner.os == 'Windows'
        run: dotnet build CNC.NCO.Launcher.csproj -c Release -r win-x64 --self-contained

      # For macOS Intel, use osx-x64 runtime
      - name: Build self-contained for macOS Intel
        if: runner.os == 'macOS' && matrix.os != 'macos-12-runner'
        run: dotnet build CNC.NCO.Launcher.csproj -c Release -r osx-x64 --self-contained

      - name: Upload artifacts (Linux)
        if: runner.os == 'Linux'
        uses: actions/upload-artifact@v4
        with:
          name: cnc-launcher-linux-x64
          path: bin/Release/net9.0/linux-x64/publish/

      - name: Upload artifacts (Windows)
        if: runner.os == 'Windows'
        uses: actions/upload-artifact@v4
        with:
          name: cnc-launcher-win-x64
          path: bin\Release\net9.0\win-x64\publish\

      - name: Upload artifacts (macOS Intel)
        if: runner.os == 'macOS' && matrix.os != 'macos-12-runner'
        uses: actions/upload-artifact@v4
        with:
          name: cnc-launcher-osx-x64
          path: bin/Release/net9.0/osx-x64/publish/

      - name: Upload artifacts (macOS ARM)
        if: runner.os == 'macOS' && matrix.os == 'macos-12-runner'
        uses: actions/upload-artifact@v4
        with:
          name: cnc-launcher-osx-arm64
          path: bin/Release/net9.0/osx-arm64/publish/
