name: deploy-wiki

on:
  workflow_dispatch:

  # wiki workflow runs in 'dry run' mode on PRs
  pull_request:
    paths: &change-paths
      - .github/workflows/wiki.yml
      - wiki/**

  # wiki should only be deployed from main
  push:
    branches:
      - main
    paths: *change-paths

concurrency:
  group: ${{ github.ref }}__wiki
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

permissions:
  contents: write

jobs:
  publish-wiki:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v3

      - name: Render Wiki Templates
        run: |
          python -m venv .venv
          .venv/bin/activate

          python -m ensurepip
          pip install jinja2

          python scripts/99.generate-tiberian-dawn-rules-doc.py

      - uses: Andrew-Chen-Wang/github-wiki-action@v5
        with:
          strategy: init
          preprocess: true
          ignore: |
            .obsidian
            *.j2
          dry-run: ${{ github.ref != 'refs/heads/main' }}
