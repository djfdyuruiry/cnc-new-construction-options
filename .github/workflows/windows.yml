name: windows

permissions:
  contents: write
  packages: write

on:
  workflow_dispatch:
    inputs:
      arch_win:
        description: 'Windows architecture (e.g., Win64)'
        required: false
        default: 'Win64'
      arch_lin:
        description: 'Linux architecture (e.g., x86_64)'
        required: false
        default: 'x86_64'

  pull_request:
    paths:
      - CMake**
      - vcpkg**
      - .github/workflows/windows.yml
      - cmake/**
      - common/**
      - redalert/**
      - resources
      - tests/**
      - tiberiandawn/**
      - tools/**

  push:
    branches:
      - main

concurrency:
  group: ${{ github.ref }}__windows
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

env:
  NUGET_URL: https://nuget.pkg.github.com/djfdyuruiry/index.json

jobs:
  resolve_win_cmake_preset:
    runs-on: windows-2025
    outputs:
      preset: ${{ steps.set_preset.outputs.preset }}
    steps:
    - uses: actions/checkout@v4
      with:
        fetch-depth: 0
        ref: "${{ github.event.pull_request.head.sha || github.sha }}"

    - name: Scan for Preset Files in Changes
      uses: dorny/paths-filter@v3
      id: changes
      with:
        filters: |
          ci:
            - .github/workflows/windows.yml
          nco:
            - .clang-format
            - CMake**
            - cmake/**
            - common/**
            - tools/**
          ra:
            - redalert/**
            - resources/data/ra
          td:
            - tiberiandawn/**
            - resources/data/td

    - name: Set Preset
      id: set_preset
      shell: bash
      run: |
        PRESET=""

        if [ "${{ steps.changes.outputs.nco }}" = "true" ]; then
          echo "Changes to shared files detected - building everything using cmake preset: release"
          PRESET="release"
        elif [ "${{ steps.changes.outputs.ra }}" = "true" ] && [ "${{ steps.changes.outputs.td }}" = "true" ]; then
          echo "Red Alert & Tiberian Dawn changes detected - building both using cmake preset: release"
          PRESET="release"
        elif [ "${{ steps.changes.outputs.ra }}" = "true" ] ; then
          echo "Only Red Alert changes detected - using cmake preset: red-alert"
          PRESET="red-alert"
        elif [ "${{ steps.changes.outputs.td }}" = "true" ]; then
          echo "Only Tiberian Dawn changes detected - using cmake preset: tiberian-dawn"
          PRESET="tiberian-dawn"
        elif [ "${{ steps.changes.outputs.ci }}" = "true" ]; then
          echo "Workflow yml changes detected - testing workflow changes using cmake preset: release"
          PRESET="release"
        else
          echo "WARNING: Unable to match changed files to a preset - defaulting to building everything using cmake preset: release"
          PRESET="release"
        fi

        echo "preset=${PRESET}" >> $GITHUB_OUTPUT

  nco_win_msvc:
    needs:
      - resolve_win_cmake_preset
    runs-on: windows-2025
    strategy:
      matrix:
        arch:
          - win: "${{ github.event.inputs.arch_win || 'Win64' }}"
            lin: "${{ github.event.inputs.arch_lin || 'x86_64' }}"
            cmd: x64

    steps:
    - uses: actions/checkout@v4
      with:
        submodules: 'true'
        fetch-depth: 0
        ref: "${{ github.event.pull_request.head.sha || github.sha }}"

    - uses: ilammy/msvc-dev-cmd@v1.13.0
      with:
        arch: ${{ matrix.arch.cmd }}

    - name: Set Git Info
      id: gitinfo
      shell: pwsh
      run: |
        $gitoutput = git rev-parse --short HEAD
        echo "sha_short=${gitoutput}" >> $env:GITHUB_OUTPUT

    - name: Init vcpkg
      run: scripts/bin/vcpkg.ps1 --init

    - name: Init vcpkg Binary Cache
      run: |
        nuget sources add `
          -Source "${{ env.NUGET_URL }}" `
          -StorePasswordInClearText `
          -Name GitHubPackages `
          -UserName "djfdyuruiry" `
          -Password "${{ secrets.GITHUB_TOKEN }}"

        nuget setapikey "${{ secrets.GITHUB_TOKEN }}" `
          -Source "${{ env.NUGET_URL }}"

    - name: Build NCO
      env:
        CMAKE_MAKE_PROGRAM: ninja
        VC_CXX_FLAGS: "/Zc:strictStrings;-wd4244;-wd4018;-wd4291;-wd4101;-wd4267;-wd4200;-wd4828"
        VCPKG_BINARY_SOURCES: "clear;nuget,${{ env.NUGET_URL }},readwrite"
      run: |
        $env:CMAKE_FIND_ROOT_PATH="$(Split-Path -Path $(Get-Command magick).Path -Parent)"

        cmake --workflow --preset ${{ needs.resolve_win_cmake_preset.outputs.preset }}

    # TODO: separate out ra and td into sep archives (separate folders in zip for now)
    - name: Create archives
      shell: bash
      run: |
        mkdir artifact

        # ninja build log (useful for profiling compilation)
        7z a artifact/nco-${{ needs.resolve_win_cmake_preset.outputs.preset }}-win-msvc-${{ matrix.arch.lin }}-${{ steps.gitinfo.outputs.sha_short }}-debug.zip build/${{ steps.set_preset.outputs.preset }}/.ninja_log

        if [ "${{ needs.resolve_win_cmake_preset.outputs.preset }}" != "tiberian-dawn" ]; then
          # debug symbols
          7z a artifact/nco-${{ needs.resolve_win_cmake_preset.outputs.preset }}-win-msvc-${{ matrix.arch.lin }}-${{ steps.gitinfo.outputs.sha_short }}-debug.zip ./build/${{ needs.resolve_win_cmake_preset.outputs.preset }}/RelWithDebInfo/*.pdb ./build/${{ needs.resolve_win_cmake_preset.outputs.preset }}/RelWithDebInfo/ra/*.pdb

          rm -rf ./build/${{ needs.resolve_win_cmake_preset.outputs.preset }}/RelWithDebInfo/ra/*.pdb

          # ra bundle
          7z a artifact/nco-${{ needs.resolve_win_cmake_preset.outputs.preset }}-win-msvc-${{ matrix.arch.lin }}-${{ steps.gitinfo.outputs.sha_short }}.zip ./build/${{ needs.resolve_win_cmake_preset.outputs.preset }}/RelWithDebInfo/ra
        fi

        if [ "${{ needs.resolve_win_cmake_preset.outputs.preset }}" != "red-alert" ]; then
          # debug symbols
          7z a artifact/nco-${{ needs.resolve_win_cmake_preset.outputs.preset }}-win-msvc-${{ matrix.arch.lin }}-${{ steps.gitinfo.outputs.sha_short }}-debug.zip ./build/${{ needs.resolve_win_cmake_preset.outputs.preset }}/RelWithDebInfo/*.pdb ./build/${{ needs.resolve_win_cmake_preset.outputs.preset }}/RelWithDebInfo/td/*.pdb

          rm -rf ./build/${{ needs.resolve_win_cmake_preset.outputs.preset }}/RelWithDebInfo/td/*.pdb    

          # td bundle
          rm -f ./build/${{ needs.resolve_win_cmake_preset.outputs.preset }}/RelWithDebInfo/td/*.sh
          7z a artifact/nco-${{ needs.resolve_win_cmake_preset.outputs.preset }}-win-msvc-${{ matrix.arch.lin }}-${{ steps.gitinfo.outputs.sha_short }}.zip ./build/${{ needs.resolve_win_cmake_preset.outputs.preset }}/RelWithDebInfo/td
        fi

    - name: Add internal tools to archive
      run: |
        7z a artifact/nco-${{ needs.resolve_win_cmake_preset.outputs.preset }}-win-msvc-${{ matrix.arch.lin }}-${{ steps.gitinfo.outputs.sha_short }}.zip ./build/${{ needs.resolve_win_cmake_preset.outputs.preset }}/RelWithDebInfo/nco-mix.exe
        7z a artifact/nco-${{ needs.resolve_win_cmake_preset.outputs.preset }}-win-msvc-${{ matrix.arch.lin }}-${{ steps.gitinfo.outputs.sha_short }}-debug.zip ./build/${{ needs.resolve_win_cmake_preset.outputs.preset }}/RelWithDebInfo/nco-mix.pdb

    - name: Upload artifact
      uses: actions/upload-artifact@v4
      with:
        name: nco-${{ needs.resolve_win_cmake_preset.outputs.preset }}-win-msvc-${{ matrix.arch.lin }}
        path: artifact

    - name: Upload development release
      if: ${{ github.event_name != 'pull_request' && github.ref == 'refs/heads/main' }}
      uses: softprops/action-gh-release@v2
      with:
        name: Development Build
        tag_name: "latest"
        prerelease: true
        files: |
          artifact/*

    - name: Upload tagged release
      if: ${{ startsWith(github.ref, 'refs/tags/') }}
      uses: softprops/action-gh-release@v2
      with:
        files: |
          artifact/*

