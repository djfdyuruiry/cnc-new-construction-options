name: mingw-w64

on:
  workflow_dispatch:
    inputs:
      arch_win:
        description: 'Windows architecture (e.g., Win64)'
        required: false
        default: 'Win64'
      arch_lin:
        description: 'Linux architecture (e.g., x86_64)'
        required: false
        default: 'x86_64'
      preset:
        description: 'Build preset (e.g., nco-tiberian-dawn)'
        required: false
        default: 'nco-tiberian-dawn'

  # TODO: Builds *only* run for PRs and *only* if you label the PR with 'mingw'.
  #       I want to save on action minute usage for now.
  pull_request:
    paths:
      - .clang-format
      - CMake**
      - .github/workflows/mingw.yml
      - cmake/**
      - common/**
      - redalert/**
      - resources
      - tests/**
      - tiberiandawn/**
      - tools/**

  # push:
  #   branches:
  #     - main
  #   paths:
  #     - .clang-format
  #     - CMake**
  #     - .github/workflows/mingw.yml
  #     - cmake/**
  #     - common/**
  #     - redalert/**
  #     - resources
  #     - tests/**
  #     - tiberiandawn/**
  #     - tools/**

concurrency:
  group: ${{ github.ref }}__mingw
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

env:
  NUGET_URL: https://nuget.pkg.github.com/djfdyuruiry/index.json

jobs:
  vanilla_win_gcc:
    if: contains(github.event.pull_request.labels.*.name, 'mingw')
    runs-on: ubuntu-22.04
    strategy:
      matrix:
        arch:
          - win: "${{ github.event.inputs.arch_win || 'Win64' }}"
            lin: "${{ github.event.inputs.arch_lin || 'x86_64' }}"
        preset:
          - "${{ github.event.inputs.preset || 'nco-tiberian-dawn' }}"

    steps:
    - uses: actions/checkout@v4
      with:
        submodules: 'true'
        fetch-depth: 0
        ref: "${{ github.sha }}"

    - name: Set Git Info
      id: gitinfo
      run: echo "sha_short=$(git rev-parse --short HEAD)" >> $GITHUB_OUTPUT

    # BUG: Needs https://github.com/HolyBlackCat/quasi-msys2 instead
    - name: Install Dependencies
      run: |
        sudo apt-get install -y autoconf-archive \
          build-essential \
          cmake \
          clang \
          imagemagick \
          mingw-w64 \
          mono-complete \
          ninja-build

    - name: Scan for Preset Files in Changes
      uses: dorny/paths-filter@v3
      id: changes
      with:
        filters: |
          ci:
            - .github/workflows/linux.yml
          nco:
            - .clang-format
            - CMake**
            - cmake/**
            - common/**
            - tools/**
          ra:
            - redalert/**
            - resources/data/ra
          td:
            - tiberiandawn/**
            - resources/data/td
          lua:
            - common/lua/scripts/**
            - tiberiandawn/lua/scripts/**
            - resources/test/**/lua
            - tests/lua/scripts/**

    - name: Init Lua
      if: steps.changes.outputs.lua == 'true'
      uses: leafo/gh-actions-lua@v11
      with:
        luaVersion: "5.4"

    - name: Run Lua Tests
      if: steps.changes.outputs.lua == 'true'
      run: |
        ./scripts/98.run-lua-unit-tests.sh \
        && ./scripts/99.test-lua-script.sh ./resources/test/td/lua/scg01ea.lua

    - name: Set Preset
      id: set_preset
      run: |
        PRESET=""

        if [ "${{ steps.changes.outputs.nco }}" = "true" ]; then
          echo "Changes to shared files detected - building everything using cmake preset: nco"
          PRESET="nco"
        elif [ "${{ steps.changes.outputs.ra }}" = "true" ] && [ "${{ steps.changes.outputs.td }}" = "true" ]; then
          echo "Red Alert & Tiberian Dawn changes detected - building both using cmake preset: nco"
          PRESET="nco"
        elif [ "${{ steps.changes.outputs.ra }}" = "true" ] ; then
          echo "Only Red Alert changes detected - using cmake preset: nco-red-alert"
          PRESET="nco-red-alert"
        elif [ "${{ steps.changes.outputs.td }}" = "true" ]; then
          echo "Only Tiberian Dawn changes detected - using cmake preset: nco-tiberian-dawn"
          PRESET="nco-tiberian-dawn"
        elif [ "${{ steps.changes.outputs.ci }}" = "true" ]; then
          echo "Workflow yml changes detected - testing workflow changes using cmake preset: nco"
          PRESET="nco"
        else
          echo "WARNING: Unable to match changed files to a preset - defaulting to building everything using cmake preset: nco"
          PRESET="nco"
        fi

        echo "preset=${PRESET}" >> $GITHUB_OUTPUT

    - name: Init vcpkg
      run: |
        ./scripts/bin/vcpkg --init
        ./scripts/bin/vcpkg fetch nuget

    - name: Init Binary Cache
      run: |
        cd "$(dirname "$(./scripts/bin/vcpkg fetch nuget)")"

        mono nuget.exe sources add \
          -Source "${{ env.NUGET_URL }}" \
          -StorePasswordInClearText \
          -Name GitHubPackages \
          -UserName "djfdyuruiry" \
          -Password "${{ secrets.GITHUB_TOKEN }}"

        mono nuget.exe setapikey "${{ secrets.GITHUB_TOKEN }}" \
          -Source "${{ env.NUGET_URL }}"

    - name: Build Vanilla Conquer
      env:
        CMAKE_MAKE_PROGRAM: ninja
        CMAKE_FIND_ROOT_PATH: "/tmp/vcpkg_installed/x64-mingw-dynamic"
        CMAKE_TOOLCHAIN_FILE: "cmake/${{ matrix.arch.lin }}-mingw-w64-toolchain.cmake"
        VC_CXX_FLAGS: "-w;-Wwrite-strings;-Werror=write-strings"
        VCPKG_BINARY_SOURCES: "clear;nuget,${{ env.NUGET_URL }},readwrite"
      run: |
        # manually install vcpkg packages
        mkdir -p /tmp/vcpkg_installed
        ./scripts/bin/vcpkg install --triplet=x64-mingw-dynamic --x-install-root=/tmp/vcpkg_installed
  
        # disable vcpkg toolchain
        jq 'del((.configurePresets[] | select(.name == \"release\")).cacheVariables[\"CMAKE_TOOLCHAIN_FILE\"])' CMakePresets.json > /tmp/CMakePresets1.json
        mv /tmp/CMakePresets1.json CMakePresets.json

        cmake --workflow --preset ${{ steps.set_preset.outputs.preset }}

    # BUG: separate out ra and td into sep archives (data files cluttering zip)
    - name: Create archives
      run: |
        mkdir artifact

        if [ "${{ steps.set_preset.outputs.preset }}" != "nco-tiberian-dawn" ]; then
          # prepare debug symbols
          cp ./build/${{ steps.set_preset.outputs.preset }}/RelWithDebInfo/ra/vanillara.exe ./build/${{ steps.set_preset.outputs.preset }}/RelWithDebInfo/vanillara.dbg
          ${{ matrix.arch.lin }}-w64-mingw32-strip --strip-all ./build/${{ steps.set_preset.outputs.preset }}/RelWithDebInfo/ra/vanillara.exe
          ${{ matrix.arch.lin }}-w64-mingw32-objcopy --add-gnu-debuglink=./build/${{ steps.set_preset.outputs.preset }}/RelWithDebInfo/vanillara.dbg ./build/${{ steps.set_preset.outputs.preset }}/RelWithDebInfo/ra/vanillara.exe

          # 3rd party libs
          cp -fv /tmp/vcpkg_installed/x64-mingw-dynamic/bin/*.dll ./build/${{ steps.set_preset.outputs.preset }}/RelWithDebInfo/ra

          # ra bundle
          7z a artifact/vanilla-conquer-${{ steps.set_preset.outputs.preset }}-win-gcc-${{ matrix.arch.lin }}-${{ steps.gitinfo.outputs.sha_short }}.zip ./build/${{ steps.set_preset.outputs.preset }}/RelWithDebInfo/ra

          # debug symbols
          7z a artifact/vanilla-conquer-${{ steps.set_preset.outputs.preset }}-win-gcc-${{ matrix.arch.lin }}-${{ steps.gitinfo.outputs.sha_short }}-debug.zip ./build/${{ steps.set_preset.outputs.preset }}/RelWithDebInfo/vanillara.dbg
        fi

        if [ "${{ steps.set_preset.outputs.preset }}" != "nco-red-alert" ]; then
          # prepare debug symbols
          cp ./build/${{ steps.set_preset.outputs.preset }}/RelWithDebInfo/td/vanillatd.exe ./build/${{ steps.set_preset.outputs.preset }}/RelWithDebInfo/vanillatd.dbg
          ${{ matrix.arch.lin }}-w64-mingw32-strip --strip-all ./build/${{ steps.set_preset.outputs.preset }}/RelWithDebInfo/td/vanillatd.exe
          ${{ matrix.arch.lin }}-w64-mingw32-objcopy --add-gnu-debuglink=./build/${{ steps.set_preset.outputs.preset }}/RelWithDebInfo/vanillatd.dbg ./build/${{ steps.set_preset.outputs.preset }}/RelWithDebInfo/td/vanillatd.exe

          # lua binaries
          cp -fv /tmp/vcpkg_installed/x64-mingw-dynamic/tools/lua/* ./build/${{ steps.set_preset.outputs.preset }}/RelWithDebInfo/td/lua

          # 3rd party libs
          cp -fv /tmp/vcpkg_installed/x64-mingw-dynamic/bin/*.dll ./build/${{ steps.set_preset.outputs.preset }}/RelWithDebInfo/td

          # td bundle
          rm -f ./build/${{ steps.set_preset.outputs.preset }}/RelWithDebInfo/td/*.sh
          7z a artifact/vanilla-conquer-${{ steps.set_preset.outputs.preset }}-win-gcc-${{ matrix.arch.lin }}-${{ steps.gitinfo.outputs.sha_short }}.zip ./build/${{ steps.set_preset.outputs.preset }}/RelWithDebInfo/td

          # debug symbols
          7z a artifact/vanilla-conquer-${{ steps.set_preset.outputs.preset }}-win-gcc-${{ matrix.arch.lin }}-${{ steps.gitinfo.outputs.sha_short }}-debug.zip ./build/${{ steps.set_preset.outputs.preset }}/RelWithDebInfo/vanillatd.dbg
        fi

    - name: Add internal tools to archive
      run: |
        cp ./build/${{ steps.set_preset.outputs.preset }}/RelWithDebInfo/vanillamix.exe ./build/${{ steps.set_preset.outputs.preset }}/RelWithDebInfo/vanillamix.dbg
        ${{ matrix.arch.lin }}-w64-mingw32-strip --strip-all ./build/${{ steps.set_preset.outputs.preset }}/RelWithDebInfo/vanillamix.exe
        ${{ matrix.arch.lin }}-w64-mingw32-objcopy --add-gnu-debuglink=./build/${{ steps.set_preset.outputs.preset }}/RelWithDebInfo/vanillamix.dbg ./build/${{ steps.set_preset.outputs.preset }}/RelWithDebInfo/vanillamix.exe
        7z a artifact/vanilla-conquer-${{ steps.set_preset.outputs.preset }}-win-gcc-${{ matrix.arch.lin }}-${{ steps.gitinfo.outputs.sha_short }}.zip ./build/${{ steps.set_preset.outputs.preset }}/RelWithDebInfo/vanillamix.exe
        7z a artifact/vanilla-conquer-${{ steps.set_preset.outputs.preset }}-win-gcc-${{ matrix.arch.lin }}-${{ steps.gitinfo.outputs.sha_short }}-debug.zip ./build/${{ steps.set_preset.outputs.preset }}/RelWithDebInfo/vanillamix.dbg

    - name: Upload artifact
      uses: actions/upload-artifact@v4
      with:
        name: vanilla-conquer-${{ steps.set_preset.outputs.preset }}-win-gcc-${{ matrix.arch.lin }}
        path: artifact

    - name: Upload development release
      if: ${{ github.event_name != 'pull_request' && github.ref == 'refs/heads/main' }}
      uses: softprops/action-gh-release@v2
      with:
        name: Development Build
        tag_name: "latest"
        prerelease: true
        files: |
          artifact/*
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

    - name: Upload tagged release
      if: ${{ startsWith(github.ref, 'refs/tags/') }}
      uses: softprops/action-gh-release@v2
      with:
        files: |
          artifact/*
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
