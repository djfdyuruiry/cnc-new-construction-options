name: linux

permissions:
  packages: write

on:
  workflow_dispatch:
    inputs:
      c_compiler:
        description: 'C Compiler (e.g. clang, gcc)'
        required: false
        default: 'clang'
      cpp_compiler:
        description: 'C++ Compiler (e.g. clang++, g++)'
        required: false
        default: 'clang++'
      preset:
        description: 'Build preset (e.g., nco-tiberian-dawn)'
        required: false
        default: 'nco-tiberian-dawn'
      os:
        description: 'OS to run on (e.g., ubuntu-24.04)'
        required: false
        default: 'ubuntu-24.04'

  pull_request:
    paths:
      - .clang-format
      - CMake**
      - .github/workflows/linux.yml
      - cmake/**
      - common/**
      - redalert/**
      - resources
      - tests/**
      - tiberiandawn/**
      - tools/**

  push:
    branches:
      - main
    paths:
      - .clang-format
      - CMake**
      - .github/workflows/linux.yml
      - cmake/**
      - common/**
      - redalert/**
      - resources
      - tests/**
      - tiberiandawn/**
      - tools/**
concurrency:
  group: ${{ github.ref }}__linux
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

env:
  NUGET_URL: https://nuget.pkg.github.com/djfdyuruiry/index.json

jobs:
  create_dev_release:
    if: ${{ github.event_name != 'pull_request' && github.ref == 'refs/heads/main' }}
    runs-on: "${{ github.event.inputs.os || 'ubuntu-24.04' }}"
    steps:
    - name: Create Development release
      uses: "marvinpinto/action-automatic-releases@v1.2.1"
      with:
        repo_token: "${{ secrets.GITHUB_TOKEN }}"
        automatic_release_tag: "latest"
        prerelease: true
        title: "Development Build"

  vanilla-linux:
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        compiler:
          - cc: "${{ github.event.inputs.c_compiler || 'clang' }}"
            cxx: "${{ github.event.inputs.cpp_compiler || 'clang++' }}"
        os:
          - "${{ github.event.inputs.os || 'ubuntu-24.04' }}"

    steps:
    - uses: actions/checkout@v4
      with:
        submodules: 'true'
        fetch-depth: 0
        ref: "${{ github.event.pull_request.head.sha || github.sha }}"

    - name: Scan for Preset Files in Changes
      uses: dorny/paths-filter@v3
      id: changes
      with:
        filters: |
          ci:
            - .github/workflows/linux.yml
          nco:
            - .clang-format
            - CMake**
            - cmake/**
            - common/**
            - tools/**
          ra:
            - redalert/**
            - resources/data/ra
          td:
            - tiberiandawn/**
            - resources/data/td
          lua:
            - common/lua/scripts/**
            - tiberiandawn/lua/scripts/**
            - resources/test/**/lua
            - tests/lua/scripts/**

    - name: Init Lua
      if: steps.changes.outputs.lua == 'true'
      uses: leafo/gh-actions-lua@v11
      with:
        luaVersion: "5.4"

    - name: Run Lua Tests
      if: steps.changes.outputs.lua == 'true'
      run: |
        ./scripts/98.run-lua-unit-tests.sh \
        && ./scripts/99.test-lua-script.sh ./resources/test/td/lua/scg01ea.lua

    - name: Set Preset
      id: set_preset
      run: |
        PRESET=""

        if [ "${{ steps.changes.outputs.nco }}" = "true" ]; then
          echo "Changes to shared files detected - building everything using cmake preset: nco"
          PRESET="nco"
        elif [ "${{ steps.changes.outputs.ra }}" = "true" ] && [ "${{ steps.changes.outputs.td }}" = "true" ]; then
          echo "Red Alert & Tiberian Dawn changes detected - building both using cmake preset: nco"
          PRESET="nco"
        elif [ "${{ steps.changes.outputs.ra }}" = "true" ] ; then
          echo "Only Red Alert changes detected - using cmake preset: nco-red-alert"
          PRESET="nco-red-alert"
        elif [ "${{ steps.changes.outputs.td }}" = "true" ]; then
          echo "Only Tiberian Dawn changes detected - using cmake preset: nco-tiberian-dawn"
          PRESET="nco-tiberian-dawn"
        elif [ "${{ steps.changes.outputs.ci }}" = "true" ]; then
          echo "Workflow yml changes detected - testing workflow changes using cmake preset: nco"
          PRESET="nco"
        else
          echo "WARNING: Unable to match changed files to a preset - defaulting to building everything using cmake preset: nco"
          PRESET="nco"
        fi

        echo "preset=${PRESET}" >> $GITHUB_OUTPUT

    - name: Set Git Info
      id: gitinfo
      run: echo "sha_short=$(git rev-parse --short HEAD)" >> $GITHUB_OUTPUT

    # TODO: refine from mono-complete to actual list of packages needed for nuget.exe
    - name: Fetch Build Tools
      run: |
        sudo apt-get install -y autoconf-archive \
          build-essential \
          cmake \
          clang \
          imagemagick \
          mono-complete \
          ninja-build

    - name: Fetch Dependencies
      run: |
        # vcpkg sub-dependency libxcrypt needs this
        # TODO: include these headers in the repo instead
        sudo apt-get install -y libltdl-dev

        # SDL2 X11/Wayland support
        sudo apt-get install -y libegl1-mesa-dev libwayland-dev libxkbcommon-dev libx11-dev libxext-dev libxft-dev

    - name: Init vcpkg
      run: |
        ./scripts/bin/vcpkg --init
        ./scripts/bin/vcpkg fetch nuget

    - name: Init Binary Cache
      run: |
        cd "$(dirname "$(./scripts/bin/vcpkg fetch nuget)")"

        mono nuget.exe sources add \
          -Source "${{ env.NUGET_URL }}" \
          -StorePasswordInClearText \
          -Name GitHubPackages \
          -UserName "djfdyuruiry" \
          -Password "${{ secrets.GITHUB_TOKEN }}"

        mono nuget.exe setapikey "${{ secrets.GITHUB_TOKEN }}" \
          -Source "${{ env.NUGET_URL }}"

    - name: Build Vanilla Conquer
      env:
        CC: ${{ matrix.compiler.cc }}
        CXX: ${{ matrix.compiler.cxx }}
        CMAKE_MAKE_PROGRAM: ninja
        VC_CXX_FLAGS: "-w;-Wwrite-strings;-Werror=write-strings"
        VCPKG_BINARY_SOURCES: "clear;nuget,${{ env.NUGET_URL }},readwrite"
      run: |
        cmake --workflow --preset ${{ steps.set_preset.outputs.preset }}

    # TODO: re-enable after making formatting changes suggested (changes alot of files)
    # - name: Check formatting
    #   if: ${{ matrix.compiler.cc == 'clang' }}
    #   run: |
    #     cmake --build build/${{ steps.set_preset.outputs.preset }} --target format
    #     git diff --exit-code

    # BUG: separate out ra and td into sep archives (data files cluttering zip)
    - name: Create archives
      run: |
        # prep debug symbols
        if [ "${{ steps.set_preset.outputs.preset }}" != "nco-tiberian-dawn" ]; then
          cp ./build/${{ steps.set_preset.outputs.preset }}/RelWithDebInfo/ra/vanillara ./build/${{ steps.set_preset.outputs.preset }}/RelWithDebInfo/vanillara.dbg
          strip --strip-all ./build/${{ steps.set_preset.outputs.preset }}/RelWithDebInfo/ra/vanillara
          objcopy --add-gnu-debuglink=./build/${{ steps.set_preset.outputs.preset }}/RelWithDebInfo/vanillara.dbg ./build/${{ steps.set_preset.outputs.preset }}/RelWithDebInfo/ra/vanillara
        fi

        if [ "${{ steps.set_preset.outputs.preset }}" != "nco-red-alert" ]; then
          cp ./build/${{ steps.set_preset.outputs.preset }}/RelWithDebInfo/td/vanillatd ./build/${{ steps.set_preset.outputs.preset }}/RelWithDebInfo/vanillatd.dbg
          strip --strip-all ./build/${{ steps.set_preset.outputs.preset }}/RelWithDebInfo/td/vanillatd
          objcopy --add-gnu-debuglink=./build/${{ steps.set_preset.outputs.preset }}/RelWithDebInfo/vanillatd.dbg ./build/${{ steps.set_preset.outputs.preset }}/RelWithDebInfo/td/vanillatd
        fi

        mkdir artifact

        if [ "${{ steps.set_preset.outputs.preset }}" != "nco-tiberian-dawn" ]; then
          # ra bundle
          7z a artifact/vanilla-conquer-${{ steps.set_preset.outputs.preset }}-linux-${{ matrix.compiler.cc }}-${{ matrix.os }}-x86_64-${{ steps.gitinfo.outputs.sha_short }}.zip ./build/${{ steps.set_preset.outputs.preset }}/RelWithDebInfo/ra

          # debug symbols
          7z a artifact/vanilla-conquer-${{ steps.set_preset.outputs.preset }}-linux-${{ matrix.compiler.cc }}-${{ matrix.os }}-x86_64-${{ steps.gitinfo.outputs.sha_short }}-debug.zip ./build/${{ steps.set_preset.outputs.preset }}/RelWithDebInfo/vanillara.dbg
        fi

        if [ "${{ steps.set_preset.outputs.preset }}" != "nco-red-alert" ]; then
          # lua binaries
          cp -fv ./build/${{ steps.set_preset.outputs.preset }}/vcpkg_installed/*/tools/lua/* ./build/${{ steps.set_preset.outputs.preset }}/RelWithDebInfo/td/lua

          # td bundle
          rm -f build/${{ steps.set_preset.outputs.preset }}/RelWithDebInfo/td/*.bat
          7z a artifact/vanilla-conquer-${{ steps.set_preset.outputs.preset }}-linux-${{ matrix.compiler.cc }}-${{ matrix.os }}-x86_64-${{ steps.gitinfo.outputs.sha_short }}.zip ./build/${{ steps.set_preset.outputs.preset }}/RelWithDebInfo/td

          # debug symbols
          7z a artifact/vanilla-conquer-${{ steps.set_preset.outputs.preset }}-linux-${{ matrix.compiler.cc }}-${{ matrix.os }}-x86_64-${{ steps.gitinfo.outputs.sha_short }}-debug.zip ./build/${{ steps.set_preset.outputs.preset }}/RelWithDebInfo/vanillatd.dbg
        fi

    - name: Add internal tools to archive
      run: |
        cp ./build/${{ steps.set_preset.outputs.preset }}/RelWithDebInfo/vanillamix ./build/${{ steps.set_preset.outputs.preset }}/RelWithDebInfo/vanillamix.dbg
        objcopy --add-gnu-debuglink=./build/${{ steps.set_preset.outputs.preset }}/RelWithDebInfo/vanillamix.dbg ./build/${{ steps.set_preset.outputs.preset }}/RelWithDebInfo/vanillamix
        strip --strip-all ./build/${{ steps.set_preset.outputs.preset }}/RelWithDebInfo/vanillamix

        7z a artifact/vanilla-conquer-${{ steps.set_preset.outputs.preset }}-linux-${{ matrix.compiler.cc }}-${{ matrix.os }}-x86_64-${{ steps.gitinfo.outputs.sha_short }}.zip ./build/${{ steps.set_preset.outputs.preset }}/RelWithDebInfo/vanillamix
        7z a artifact/vanilla-conquer-${{ steps.set_preset.outputs.preset }}-linux-${{ matrix.compiler.cc }}-${{ matrix.os }}-x86_64-${{ steps.gitinfo.outputs.sha_short }}-debug.zip ./build/${{ steps.set_preset.outputs.preset }}/RelWithDebInfo/vanillamix.dbg

    - name: Upload artifact
      uses: actions/upload-artifact@v4
      with:
        name: vanilla-conquer-${{ steps.set_preset.outputs.preset }}-linux-${{ matrix.compiler.cc }}-${{ matrix.os }}-x86_64
        path: artifact

    - name: Upload development release
      if: ${{ github.event_name != 'pull_request' && github.ref == 'refs/heads/main' }}
      uses: softprops/action-gh-release@v2
      with:
        name: Development Build
        tag_name: "latest"
        prerelease: true
        files: |
          artifact/*
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

    - name: Upload tagged release
      if: ${{ startsWith(github.ref, 'refs/tags/') }}
      uses: softprops/action-gh-release@v2
      with:
        files: |
          artifact/*
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
