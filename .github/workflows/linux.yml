name: linux

permissions:
  contents: write
  packages: write

on:
  workflow_dispatch:
    inputs:
      c_compiler:
        description: 'C Compiler (e.g. clang, gcc)'
        required: false
        default: 'clang'
      cpp_compiler:
        description: 'C++ Compiler (e.g. clang++, g++)'
        required: false
        default: 'clang++'
      preset:
        description: 'Build preset (e.g., tiberian-dawn)'
        required: false
        default: 'tiberian-dawn'
      os:
        description: 'OS to run on (e.g., ubuntu-24.04)'
        required: false
        default: 'ubuntu-24.04'

  pull_request:
    paths:
      - .clang-format
      - CMake**
      - vcpkg**
      - .github/workflows/linux.yml
      - cmake/**
      - common/**
      - redalert/**
      - resources
      - tests/**
      - tiberiandawn/**
      - tools/**

  push:
    branches:
      - main

concurrency:
  group: ${{ github.ref }}__linux
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

env:
  NUGET_URL: https://nuget.pkg.github.com/djfdyuruiry/index.json

jobs:
  nco-linux:
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        compiler:
          - cc: "${{ github.event.inputs.c_compiler || 'clang' }}"
            cxx: "${{ github.event.inputs.cpp_compiler || 'clang++' }}"
        os:
          - "${{ github.event.inputs.os || 'ubuntu-24.04' }}"

    steps:
    - uses: actions/checkout@v4
      with:
        submodules: 'true'
        fetch-depth: 0
        ref: "${{ github.event.pull_request.head.sha || github.sha }}"

    - name: Scan for Preset Files in Changes
      uses: dorny/paths-filter@v3
      id: changes
      with:
        filters: |
          ci:
            - .github/workflows/linux.yml
          nco:
            - .clang-format
            - CMake**
            - cmake/**
            - common/**
            - tools/**
          ra:
            - redalert/**
            - resources/data/ra
          td:
            - tiberiandawn/**
            - resources/data/td

    - name: Set Preset
      id: set_preset
      run: |
        PRESET=""

        if [ "${{ github.event_name}}" != "pull_request" ] && [ "${{ github.ref }}" = "refs/heads/main" ]; then
          echo "Main branch detected - building everything using cmake preset: release"
          PRESET="release"
        elif [ "${{ steps.changes.outputs.nco }}" = "true" ]; then
          echo "Changes to shared files detected - building everything using cmake preset: release"
          PRESET="release"
        elif [ "${{ steps.changes.outputs.ra }}" = "true" ] && [ "${{ steps.changes.outputs.td }}" = "true" ]; then
          echo "Red Alert & Tiberian Dawn changes detected - building both using cmake preset: release"
          PRESET="release"
        elif [ "${{ steps.changes.outputs.ra }}" = "true" ] ; then
          echo "Only Red Alert changes detected - using cmake preset: red-alert"
          PRESET="red-alert"
        elif [ "${{ steps.changes.outputs.td }}" = "true" ]; then
          echo "Only Tiberian Dawn changes detected - using cmake preset: tiberian-dawn"
          PRESET="tiberian-dawn"
        elif [ "${{ steps.changes.outputs.ci }}" = "true" ]; then
          echo "Workflow yml changes detected - testing workflow changes using cmake preset: release"
          PRESET="release"
        else
          echo "WARNING: Unable to match changed files to a preset - defaulting to building everything using cmake preset: release"
          PRESET="release"
        fi

        echo "preset=${PRESET}" >> $GITHUB_OUTPUT

    - name: Set Git Info
      id: gitinfo
      run: echo "sha_short=$(git rev-parse --short HEAD)" >> $GITHUB_OUTPUT

    # TODO: refine from mono-complete to actual list of packages needed for nuget.exe
    - name: Fetch Build Tools
      run: |
        sudo apt-get update
        sudo apt-get install -y autoconf-archive \
          imagemagick \
          mono-complete \
          python3-jinja2

    - name: Fetch Dependencies
      run: |
        # vcpkg sub-dependency libxcrypt needs this
        # TODO: include these headers in the repo instead
        sudo apt-get install -y libltdl-dev

        # vcpkg SDL2 package dependencies for X11/Wayland support
        sudo apt-get install -y libegl1-mesa-dev libwayland-dev libx11-dev libxft-dev libxext-dev libxkbcommon-dev

    - name: Init vcpkg
      run: |
        ./scripts/bin/vcpkg --init
        ./scripts/bin/vcpkg fetch nuget

    - name: Init Binary Cache
      run: |
        cd "$(dirname "$(./scripts/bin/vcpkg fetch nuget)")"

        mono nuget.exe sources add \
          -Source "${{ env.NUGET_URL }}" \
          -StorePasswordInClearText \
          -Name GitHubPackages \
          -UserName "djfdyuruiry" \
          -Password "${{ secrets.GITHUB_TOKEN }}"

        mono nuget.exe setapikey "${{ secrets.GITHUB_TOKEN }}" \
          -Source "${{ env.NUGET_URL }}"

    - name: Build NCO
      env:
        CC: ${{ matrix.compiler.cc }}
        CXX: ${{ matrix.compiler.cxx }}
        CMAKE_MAKE_PROGRAM: ninja
        VC_CXX_FLAGS: "-w;-Wwrite-strings;-Werror=write-strings"
        VCPKG_BINARY_SOURCES: "clear;nuget,${{ env.NUGET_URL }},readwrite"
      run: |
        cmake --workflow --preset ${{ steps.set_preset.outputs.preset }}

    # TODO: re-enable after making formatting changes suggested (changes alot of files)
    # - name: Check formatting
    #   if: ${{ matrix.compiler.cc == 'clang' }}
    #   run: |
    #     cmake --build build/${{ steps.set_preset.outputs.preset }} --target format
    #     git diff --exit-code

    # BUG: separate out ra and td into sep archives (data files cluttering zip)
    - name: Create archives
      run: |
        # prep debug symbols
        if [ "${{ steps.set_preset.outputs.preset }}" != "tiberian-dawn" ]; then
          cp ./build/${{ steps.set_preset.outputs.preset }}/RelWithDebInfo/ra/nco-ra ./build/${{ steps.set_preset.outputs.preset }}/RelWithDebInfo/nco-ra.dbg
          strip --strip-all ./build/${{ steps.set_preset.outputs.preset }}/RelWithDebInfo/ra/nco-ra
          objcopy --add-gnu-debuglink=./build/${{ steps.set_preset.outputs.preset }}/RelWithDebInfo/nco-ra.dbg ./build/${{ steps.set_preset.outputs.preset }}/RelWithDebInfo/ra/nco-ra
        fi

        if [ "${{ steps.set_preset.outputs.preset }}" != "red-alert" ]; then
          cp ./build/${{ steps.set_preset.outputs.preset }}/RelWithDebInfo/td/nco-td ./build/${{ steps.set_preset.outputs.preset }}/RelWithDebInfo/nco-td.dbg
          strip --strip-all ./build/${{ steps.set_preset.outputs.preset }}/RelWithDebInfo/td/nco-td
          objcopy --add-gnu-debuglink=./build/${{ steps.set_preset.outputs.preset }}/RelWithDebInfo/nco-td.dbg ./build/${{ steps.set_preset.outputs.preset }}/RelWithDebInfo/td/nco-td
        fi

        mkdir artifact

        # ninja build log (useful for profiling compilation)
        tar -rf artifact/nco-${{ steps.set_preset.outputs.preset }}-linux-${{ matrix.compiler.cc }}-${{ matrix.os }}-x86_64-${{ steps.gitinfo.outputs.sha_short }}-debug.tar -C build/${{ steps.set_preset.outputs.preset }} .ninja_log

        if [ "${{ steps.set_preset.outputs.preset }}" != "tiberian-dawn" ]; then
          # ra bundle
           tar -rf artifact/nco-${{ steps.set_preset.outputs.preset }}-linux-${{ matrix.compiler.cc }}-${{ matrix.os }}-x86_64-${{ steps.gitinfo.outputs.sha_short }}.tar -C ./build/${{ steps.set_preset.outputs.preset }}/RelWithDebInfo ra

          # debug symbols
           tar -rf artifact/nco-${{ steps.set_preset.outputs.preset }}-linux-${{ matrix.compiler.cc }}-${{ matrix.os }}-x86_64-${{ steps.gitinfo.outputs.sha_short }}-debug.tar -C ./build/${{ steps.set_preset.outputs.preset }}/RelWithDebInfo nco-ra.dbg
        fi

        if [ "${{ steps.set_preset.outputs.preset }}" != "red-alert" ]; then
          # td bundle
          rm -f build/${{ steps.set_preset.outputs.preset }}/RelWithDebInfo/td/*.bat
           tar -rf artifact/nco-${{ steps.set_preset.outputs.preset }}-linux-${{ matrix.compiler.cc }}-${{ matrix.os }}-x86_64-${{ steps.gitinfo.outputs.sha_short }}.tar -C ./build/${{ steps.set_preset.outputs.preset }}/RelWithDebInfo td

          # debug symbols
           tar -rf artifact/nco-${{ steps.set_preset.outputs.preset }}-linux-${{ matrix.compiler.cc }}-${{ matrix.os }}-x86_64-${{ steps.gitinfo.outputs.sha_short }}-debug.tar -C ./build/${{ steps.set_preset.outputs.preset }}/RelWithDebInfo nco-td.dbg
        fi

    - name: Add internal tools to archive
      run: |
        cp ./build/${{ steps.set_preset.outputs.preset }}/RelWithDebInfo/nco-mix ./build/${{ steps.set_preset.outputs.preset }}/RelWithDebInfo/nco-mix.dbg
        objcopy --add-gnu-debuglink=./build/${{ steps.set_preset.outputs.preset }}/RelWithDebInfo/nco-mix.dbg ./build/${{ steps.set_preset.outputs.preset }}/RelWithDebInfo/nco-mix
        strip --strip-all ./build/${{ steps.set_preset.outputs.preset }}/RelWithDebInfo/nco-mix

        tar -rf artifact/nco-${{ steps.set_preset.outputs.preset }}-linux-${{ matrix.compiler.cc }}-${{ matrix.os }}-x86_64-${{ steps.gitinfo.outputs.sha_short }}.tar -C ./build/${{ steps.set_preset.outputs.preset }}/RelWithDebInfo nco-mix
        tar -rf artifact/nco-${{ steps.set_preset.outputs.preset }}-linux-${{ matrix.compiler.cc }}-${{ matrix.os }}-x86_64-${{ steps.gitinfo.outputs.sha_short }}-debug.tar -C ./build/${{ steps.set_preset.outputs.preset }}/RelWithDebInfo nco-mix.dbg
        gzip artifact/*.tar

    - name: Upload artifact
      uses: actions/upload-artifact@v4
      with:
        name: nco-${{ steps.set_preset.outputs.preset }}-linux-${{ matrix.compiler.cc }}-${{ matrix.os }}-x86_64
        path: artifact

    - name: Upload development release
      if: ${{ github.event_name != 'pull_request' && github.ref == 'refs/heads/main' }}
      uses: softprops/action-gh-release@v2
      with:
        name: Development Build
        tag_name: "latest"
        prerelease: true
        files: |
          artifact/*

    - name: Upload tagged release
      if: ${{ startsWith(github.ref, 'refs/tags/') }}
      uses: softprops/action-gh-release@v2
      with:
        files: |
          artifact/*
