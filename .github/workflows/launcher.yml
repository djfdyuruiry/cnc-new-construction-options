name: launcher

permissions:
  contents: write

on:
  workflow_dispatch:
    inputs:
      runtimes:
        description: List of .NET runtimes to target for distribution
        required: false
        default: win-x64 linux-x64 osx-x64 osx-arm64

  pull_request:
    paths:
      - launcher/**

  push:
    branches:
      - main
    paths:
      - launcher/**
concurrency:
  group: ${{ github.ref }}__launcher
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

jobs:
  launcher-build:
    runs-on: ubuntu-24.04
    
    defaults:
      run:
        working-directory: ./launcher

    env:
      RUNTIMES: "${{ github.event.inputs.runtimes || 'win-x64 linux-x64 osx-x64 osx-arm64'}}"

    steps:
      - uses: actions/checkout@v4
        with:
          ref: "${{ github.event.pull_request.head.sha || github.sha }}"

      - name: Set Git Info
        id: git-info
        run: echo "sha-short=$(git rev-parse --short HEAD)" >> $GITHUB_OUTPUT

      - name: Build Launcher
        run: dotnet build CNC.NCO.Launcher.csproj -c Release

      - name: Publish Native Launcher App
        run: |
          set -x

          for runtime in ${RUNTIMES}; do
            RUNTIME_OPTS=""

            if [[ "${runtime}" == osx-* ]]; then
              RUNTIME_OPTS="-t:BundleApp"
            fi

            dotnet publish CNC.NCO.Launcher.csproj \
              -c Release \
              -r "${runtime}" \
              -p:PublishSingleFile=true \
              --self-contained ${RUNTIME_OPTS}
          done

      - name: Package Native Launcher App
        run: |
          set -x

          ARTIFACT_DIR="$(pwd)/artifact"

          mkdir -p "${ARTIFACT_DIR}"

          for runtime in ${RUNTIMES}; do
            pushd bin/Release/net*/${runtime}/publish

            # TODO: lipomerge two mac app binary files into a universal app
            if [[ "${runtime}" == win-* ]]; then
              zip -9 -r "${ARTIFACT_DIR}/cnc-nco-launcher-${runtime}-${{ steps.git-info.outputs.sha-short }}.zip" .
            elif [[ "${runtime}" == osx-* ]]; then
              tar cvf - "NCO Launcher.app" | gzip -9 - > "${ARTIFACT_DIR}/cnc-nco-launcher-${runtime}-${{ steps.git-info.outputs.sha-short }}.tar.gz"
            else
              tar cvf - . | gzip -9 - > "${ARTIFACT_DIR}/cnc-nco-launcher-${runtime}-${{ steps.git-info.outputs.sha-short }}.tar.gz"
            fi

            popd
          done

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: cnc-nco-launcher
          path: launcher/artifact

      - name: Upload development release
        if: ${{ github.event_name != 'pull_request' && github.ref == 'refs/heads/main' }}
        uses: softprops/action-gh-release@v2
        with:
          name: Development Build
          tag_name: "latest"
          prerelease: true
          files: |
            launcher/artifact/*

      - name: Upload tagged release
        if: ${{ startsWith(github.ref, 'refs/tags/') }}
        uses: softprops/action-gh-release@v2
        with:
          files: |
            launcher/artifact/*
